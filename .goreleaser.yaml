version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/swear-jar
    binary: swear-jar
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - .swears.example.json

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
