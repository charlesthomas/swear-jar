name: branch

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Next version
        run: |
          GOTOOLCHAIN=auto go install github.com/caarlos0/svu/v3@v3.4.4
          release=false
          for f in $(git diff --name-only origin/main...HEAD); do
            case "$f" in
              .github/*|.claude/*|*.md|LICENSE|.gitignore) ;;
              *) release=true ;;
            esac
          done
          if [ "$release" = true ]; then
            next="$(svu next --always)"
          else
            next="no release"
          fi
          echo "Next version: $next"
          echo "Next version: \`$next\`" >> "$GITHUB_STEP_SUMMARY"
